<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --success: #059669;
            --error: #dc2626;
            --warning: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Navbar ── */
        .navbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,.07);
        }
        .brand {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.5px;
            cursor: pointer;
        }
        .search-wrap {
            flex: 1;
            max-width: 480px;
            margin: 0 32px;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
            gap: 8px;
            transition: border .15s;
        }
        .search-box:focus-within { border-color: var(--primary); }
        .search-box input {
            flex: 1;
            border: none;
            background: none;
            padding: 9px 0;
            font-size: 14px;
            outline: none;
            color: var(--text);
        }
        .search-box button {
            background: none; border: none; cursor: pointer;
            color: var(--muted); font-size: 15px;
        }
        .nav-actions { display: flex; align-items: center; gap: 8px; }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 9px;
            font-size: 14px; font-weight: 500;
            cursor: pointer; border: none; transition: all .15s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
        .btn-ghost { background: none; color: var(--text); border: 1.5px solid var(--border); }
        .btn-ghost:hover { background: var(--bg); }
        .btn-danger { background: var(--error); color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-full { width: 100%; justify-content: center; padding: 12px; }

        .cart-btn { position: relative; }
        .cart-badge {
            position: absolute; top: -5px; right: -5px;
            background: var(--error); color: white;
            font-size: 10px; font-weight: 700;
            min-width: 18px; height: 18px;
            border-radius: 999px; display: flex;
            align-items: center; justify-content: center;
            padding: 0 4px;
        }

        /* ── Main ── */
        .main { max-width: 1280px; margin: 0 auto; padding: 28px 24px; }

        .view-tabs {
            display: flex; gap: 4px; margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 10px 20px; cursor: pointer;
            font-size: 14px; font-weight: 500;
            color: var(--muted); border: none;
            background: none; border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* ── Filter ── */
        .filter-bar {
            display: flex; gap: 10px; margin-bottom: 24px;
            flex-wrap: wrap; align-items: center;
        }
        .filter-bar select, .filter-bar input[type="number"] {
            padding: 8px 12px; border: 1.5px solid var(--border);
            border-radius: 9px; font-size: 14px; color: var(--text);
            background: white; outline: none;
        }
        .filter-bar select:focus, .filter-bar input:focus { border-color: var(--primary); }
        .filter-bar input[type="number"] { width: 115px; }

        /* ── Product Grid ── */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white; border-radius: 14px;
            overflow: hidden; border: 1px solid var(--border);
            cursor: pointer; transition: transform .15s, box-shadow .15s;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(0,0,0,.1);
        }
        .product-thumb {
            height: 150px; display: flex;
            align-items: center; justify-content: center;
            font-size: 54px;
            background: linear-gradient(135deg, #f0f4ff, #e8edff);
        }
        .product-body { padding: 14px; }
        .product-cat {
            font-size: 11px; font-weight: 700;
            color: var(--primary); text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: 5px;
        }
        .product-name {
            font-size: 14px; font-weight: 600;
            line-height: 1.35; margin-bottom: 8px;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .product-price { font-size: 16px; font-weight: 700; color: var(--primary); }
        .product-stock { font-size: 12px; color: var(--muted); margin-top: 3px; }
        .out-of-stock { color: var(--error) !important; }

        /* ── Pagination ── */
        .pagination {
            display: flex; justify-content: center;
            gap: 6px; margin-top: 32px;
        }
        .page-btn {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border: 1.5px solid var(--border); border-radius: 8px;
            cursor: pointer; font-size: 14px; background: white; color: var(--text);
        }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .page-btn:hover:not(.active) { background: var(--bg); }

        /* ── Orders ── */
        .orders-list { display: flex; flex-direction: column; gap: 16px; }
        .order-card {
            background: white; border: 1px solid var(--border);
            border-radius: 14px; padding: 20px;
        }
        .order-header {
            display: flex; justify-content: space-between;
            align-items: flex-start; margin-bottom: 12px;
        }
        .order-id { font-size: 14px; color: var(--muted); font-weight: 500; }
        .order-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .order-total { font-size: 20px; font-weight: 700; }
        .order-actions { display: flex; gap: 8px; margin-top: 14px; }
        .status-pill {
            display: inline-flex; align-items: center;
            padding: 4px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 600;
        }
        .s-PENDING { background: #fef3c7; color: #92400e; }
        .s-PAID    { background: #d1fae5; color: #065f46; }
        .s-REFUNDED{ background: #e0e7ff; color: #3730a3; }
        .s-CANCELLED{ background: #fee2e2; color: #991b1b; }

        /* ── Modal ── */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 200; display: flex;
            align-items: center; justify-content: center;
            padding: 24px;
        }
        .modal {
            background: white; border-radius: 18px;
            padding: 32px; width: 100%;
            max-width: 440px; max-height: 90vh;
            overflow-y: auto; position: relative;
        }
        .modal-lg { max-width: 560px; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 22px; }
        .modal-close {
            position: absolute; top: 18px; right: 18px;
            background: none; border: none; font-size: 18px;
            cursor: pointer; color: var(--muted); line-height: 1;
        }

        /* ── Form ── */
        .fg { margin-bottom: 16px; }
        .fl {
            display: block; font-size: 13px;
            font-weight: 500; margin-bottom: 5px;
        }
        .fc {
            width: 100%; padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 9px; font-size: 14px;
            color: var(--text); outline: none;
        }
        .fc:focus { border-color: var(--primary); }
        .fc:read-only { background: var(--bg); }
        .ferr { color: var(--error); font-size: 12px; margin-top: 5px; }
        .form-footer { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; }
        .divider {
            display: flex; align-items: center; gap: 10px;
            color: var(--muted); font-size: 13px; margin: 12px 0;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }
        .link-btn {
            background: none; border: none;
            color: var(--primary); cursor: pointer;
            font-size: 13px; font-weight: 600;
        }

        /* ── Cart ── */
        .cart-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 140;
        }
        .cart-panel {
            position: fixed; top: 0; right: 0;
            width: 370px; height: 100%;
            background: white; z-index: 141;
            display: flex; flex-direction: column;
            box-shadow: -6px 0 30px rgba(0,0,0,.12);
        }
        .cart-head {
            padding: 20px 22px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .cart-head-title { font-size: 17px; font-weight: 700; }
        .cart-scroll { flex: 1; overflow-y: auto; padding: 12px 22px; }
        .cart-foot {
            padding: 18px 22px;
            border-top: 1px solid var(--border);
        }
        .cart-total-row {
            display: flex; justify-content: space-between;
            font-size: 16px; font-weight: 700; margin-bottom: 14px;
        }
        .ci {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 0; border-bottom: 1px solid var(--border);
        }
        .ci-icon {
            font-size: 26px; width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg); border-radius: 8px; flex-shrink: 0;
        }
        .ci-info { flex: 1; min-width: 0; }
        .ci-name {
            font-size: 13px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .ci-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .qty-ctrl { display: flex; align-items: center; gap: 6px; }
        .qty-btn {
            width: 26px; height: 26px; border: 1.5px solid var(--border);
            border-radius: 6px; background: white; cursor: pointer;
            font-size: 15px; display: flex; align-items: center; justify-content: center;
        }
        .qty-num { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }
        .ci-del {
            background: none; border: none;
            color: var(--error); cursor: pointer; font-size: 11px; margin-top: 3px;
        }
        .cart-empty { text-align: center; padding: 40px 20px; color: var(--muted); }

        /* ── Product Detail ── */
        .pd-thumb {
            height: 190px; display: flex;
            align-items: center; justify-content: center;
            font-size: 78px;
            background: linear-gradient(135deg, #f0f4ff, #e8edff);
            border-radius: 12px; margin-bottom: 18px;
        }
        .pd-price { font-size: 26px; font-weight: 800; color: var(--primary); margin: 10px 0; }
        .pd-desc { font-size: 14px; color: var(--muted); line-height: 1.65; margin-bottom: 18px; }
        .pd-meta {
            display: flex; justify-content: space-between;
            font-size: 13px; padding: 8px 0;
            border-top: 1px solid var(--border);
        }
        .qty-row {
            display: flex; align-items: center; gap: 14px;
            margin: 18px 0; font-size: 14px; font-weight: 500;
        }

        /* ── Order Detail ── */
        .od-item {
            display: flex; justify-content: space-between;
            padding: 9px 0; border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .od-row {
            display: flex; justify-content: space-between;
            font-size: 13px; padding: 7px 0;
            border-bottom: 1px solid var(--border);
        }
        .od-row:last-child { border-bottom: none; }
        .od-label { color: var(--muted); }

        /* ── Toast ── */
        .toast-wrap {
            position: fixed; bottom: 24px; right: 24px;
            z-index: 400; display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            padding: 13px 18px; border-radius: 10px;
            font-size: 14px; font-weight: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
            animation: slideUp .2s ease; max-width: 320px;
        }
        .t-success { background: #065f46; color: white; }
        .t-error   { background: #991b1b; color: white; }
        .t-info    { background: #1e40af; color: white; }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        /* ── User Menu ── */
        .user-wrap { position: relative; }
        .user-drop {
            position: absolute; top: 48px; right: 0;
            background: white; border: 1px solid var(--border);
            border-radius: 12px; min-width: 190px;
            box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 200;
        }
        .ud-head { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .ud-name { font-weight: 700; font-size: 14px; }
        .ud-email { font-size: 12px; color: var(--muted); }
        .ud-item {
            display: block; width: 100%;
            padding: 10px 16px; cursor: pointer;
            font-size: 14px; background: none;
            border: none; text-align: left; color: var(--text);
        }
        .ud-item:hover { background: var(--bg); }

        /* ── Misc ── */
        .loading {
            display: flex; align-items: center; justify-content: center;
            padding: 60px; color: var(--muted); gap: 12px;
        }
        .spin {
            width: 28px; height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: rot .6s linear infinite;
        }
        @keyframes rot { to { transform: rotate(360deg); } }
        .empty {
            text-align: center; padding: 60px 20px; color: var(--muted);
        }
        .empty-icon { font-size: 52px; margin-bottom: 14px; }
        .empty-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .hint-box {
            background: var(--bg); border-radius: 10px;
            padding: 12px 14px; font-size: 12px;
            color: var(--muted); margin-top: 16px; line-height: 1.7;
        }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .text-muted { color: var(--muted); font-size: 13px; }
        .mt-2 { margin-top: 8px; }
        .mt-4 { margin-top: 16px; }

        @media (max-width: 640px) {
            .search-wrap { display: none; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .cart-panel { width: 100%; }
        }
    </style>
</head>
<body>

<!-- ───────────────── Navbar ───────────────── -->
<nav class="navbar">
    <span class="brand" onclick="switchView('products')">🛍 ShopEasy</span>

    <div class="search-wrap">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="search-input" placeholder="상품 검색..."
                   oninput="debounceSearch()" onkeydown="if(event.key==='Enter') doSearch()">
            <button onclick="doSearch()">→</button>
        </div>
    </div>

    <div class="nav-actions">
        <button class="btn btn-ghost btn-sm cart-btn" onclick="openCart()">
            🛒 장바구니
            <span class="cart-badge hidden" id="cart-badge"></span>
        </button>

        <!-- 비로그인 -->
        <div id="guest-area">
            <div style="display:flex;gap:8px;">
                <button class="btn btn-ghost btn-sm" onclick="openModal('m-login')">로그인</button>
                <button class="btn btn-primary btn-sm" onclick="openModal('m-register')">회원가입</button>
            </div>
        </div>

        <!-- 로그인 -->
        <div id="user-area" class="hidden">
            <div class="user-wrap">
                <button class="btn btn-ghost btn-sm" onclick="toggleDrop()">
                    <span id="nav-name">사용자</span> ▾
                </button>
                <div class="user-drop hidden" id="user-drop">
                    <div class="ud-head">
                        <div class="ud-name" id="drop-name"></div>
                        <div class="ud-email" id="drop-email"></div>
                    </div>
                    <button class="ud-item" onclick="switchView('orders'); closeDrop()">📦 내 주문</button>
                    <button class="ud-item" onclick="doLogout()">로그아웃</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- ───────────────── Main ───────────────── -->
<div class="main">

    <div class="view-tabs hidden" id="view-tabs">
        <button class="tab active" id="tab-products" onclick="switchView('products')">🏪 상품</button>
        <button class="tab" id="tab-orders"   onclick="switchView('orders')">📦 내 주문</button>
    </div>

    <!-- Products -->
    <div id="view-products">
        <div class="filter-bar">
            <select id="f-cat" onchange="doSearch()">
                <option value="">전체 카테고리</option>
                <option value="ELECTRONICS">💻 전자기기</option>
                <option value="CLOTHING">👕 의류</option>
                <option value="BOOKS">📚 도서</option>
                <option value="SPORTS">🏃 스포츠</option>
                <option value="FOOD">🥘 식품</option>
                <option value="BEAUTY">💄 뷰티</option>
                <option value="HOME">🏠 홈</option>
            </select>
            <input type="number" id="f-min" placeholder="최저가 (₩)" min="0" onchange="doSearch()">
            <input type="number" id="f-max" placeholder="최고가 (₩)" min="0" onchange="doSearch()">
            <button class="btn btn-ghost btn-sm" onclick="resetFilters()">초기화</button>
        </div>
        <div id="product-grid" class="product-grid">
            <div class="loading"><div class="spin"></div> 불러오는 중...</div>
        </div>
        <div id="pagination" class="pagination"></div>
    </div>

    <!-- Orders -->
    <div id="view-orders" class="hidden">
        <div id="orders-list" class="orders-list">
            <div class="loading"><div class="spin"></div> 불러오는 중...</div>
        </div>
    </div>

</div>

<!-- ───────────────── Modals ───────────────── -->

<!-- Login -->
<div class="overlay hidden" id="m-login" onclick="overlayClick(event,'m-login')">
    <div class="modal">
        <button class="modal-close" onclick="closeModal('m-login')">✕</button>
        <div class="modal-title">로그인</div>
        <div class="fg">
            <label class="fl">이메일</label>
            <input class="fc" type="email" id="l-email" placeholder="이메일">
        </div>
        <div class="fg">
            <label class="fl">비밀번호</label>
            <input class="fc" type="password" id="l-pw" placeholder="비밀번호"
                   onkeydown="if(event.key==='Enter') doLogin()">
        </div>
        <p class="ferr hidden" id="l-err"></p>
        <div class="form-footer">
            <button class="btn btn-primary btn-full" onclick="doLogin()">로그인</button>
        </div>
        <div class="divider">또는</div>
        <p class="text-center text-muted">
            계정이 없으신가요?
            <button class="link-btn" onclick="closeModal('m-login');openModal('m-register')">회원가입</button>
        </p>
        <div class="hint-box">
            <strong>테스트 계정</strong><br>
            admin@shop.com / Admin1234! (관리자)<br>
            user@shop.com / User1234! (일반 사용자)
        </div>
    </div>
</div>

<!-- Register -->
<div class="overlay hidden" id="m-register" onclick="overlayClick(event,'m-register')">
    <div class="modal">
        <button class="modal-close" onclick="closeModal('m-register')">✕</button>
        <div class="modal-title">회원가입</div>
        <div class="fg">
            <label class="fl">이름</label>
            <input class="fc" type="text" id="r-name" placeholder="이름">
        </div>
        <div class="fg">
            <label class="fl">이메일</label>
            <input class="fc" type="email" id="r-email" placeholder="이메일">
        </div>
        <div class="fg">
            <label class="fl">비밀번호 <span class="text-muted">(8자 이상)</span></label>
            <input class="fc" type="password" id="r-pw" placeholder="비밀번호"
                   onkeydown="if(event.key==='Enter') doRegister()">
        </div>
        <p class="ferr hidden" id="r-err"></p>
        <div class="form-footer">
            <button class="btn btn-primary btn-full" onclick="doRegister()">가입하기</button>
        </div>
        <div class="divider">또는</div>
        <p class="text-center text-muted">
            이미 계정이 있으신가요?
            <button class="link-btn" onclick="closeModal('m-register');openModal('m-login')">로그인</button>
        </p>
    </div>
</div>

<!-- Product Detail -->
<div class="overlay hidden" id="m-product" onclick="overlayClick(event,'m-product')">
    <div class="modal modal-lg">
        <button class="modal-close" onclick="closeModal('m-product')">✕</button>
        <div class="pd-thumb" id="pd-thumb">🛍</div>
        <span style="font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;" id="pd-cat"></span>
        <div class="modal-title" id="pd-name" style="margin:6px 0 0;"></div>
        <div class="pd-price" id="pd-price"></div>
        <div class="pd-desc" id="pd-desc"></div>
        <div class="pd-meta">
            <span style="color:var(--muted);">재고</span>
            <span id="pd-stock"></span>
        </div>
        <div class="qty-row">
            <span>수량</span>
            <div class="qty-ctrl">
                <button class="qty-btn" onclick="adjQty(-1)">−</button>
                <span class="qty-num" id="pd-qty">1</span>
                <button class="qty-btn" onclick="adjQty(1)">+</button>
            </div>
        </div>
        <button class="btn btn-primary btn-full" id="pd-add" onclick="addFromModal()">
            🛒 장바구니 담기
        </button>
    </div>
</div>

<!-- Order Detail -->
<div class="overlay hidden" id="m-order" onclick="overlayClick(event,'m-order')">
    <div class="modal modal-lg">
        <button class="modal-close" onclick="closeModal('m-order')">✕</button>
        <div class="modal-title">주문 상세</div>
        <div id="order-detail"></div>
    </div>
</div>

<!-- Payment processing overlay -->
<div class="overlay hidden" id="m-payment">
    <div class="modal" style="text-align:center;">
        <div style="font-size:40px;margin-bottom:16px;">💳</div>
        <div class="modal-title" style="text-align:center;">결제 처리 중...</div>
        <p class="text-muted">잠시만 기다려주세요.</p>
    </div>
</div>

<!-- ───────────────── Cart ───────────────── -->
<div class="cart-backdrop hidden" id="cart-bd" onclick="closeCart()"></div>
<div class="cart-panel hidden" id="cart-panel">
    <div class="cart-head">
        <span class="cart-head-title">🛒 장바구니</span>
        <button class="btn btn-ghost btn-sm" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-scroll" id="cart-items"></div>
    <div class="cart-foot">
        <div class="cart-total-row">
            <span>합계</span>
            <span id="cart-total">₩0</span>
        </div>
        <button class="btn btn-primary btn-full" id="checkout-btn" onclick="doCheckout()">
            주문하기
        </button>
    </div>
</div>

<!-- ───────────────── Toast ───────────────── -->
<div class="toast-wrap" id="toasts"></div>

<!-- ───────────────── Script ───────────────── -->
<script>
// ══════════════════ STATE ══════════════════
const S = {
    token:     localStorage.getItem('se_tok'),
    refresh:   localStorage.getItem('se_ref'),
    user:      null,
    cart:      JSON.parse(localStorage.getItem('se_cart') || '[]'),
    detail:    null,
    clientKey: null,
    page:      0,
    totalPages: 0,
};

// ══════════════════ UTILS ══════════════════
const money = n => new Intl.NumberFormat('ko-KR', { style:'currency', currency:'KRW' }).format(n);

const fmtDate = s => {
    if (!s) return '';
    const d = new Date(s);
    return `${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
};
const p2 = n => String(n).padStart(2,'0');
const oid = n => '#' + String(n).padStart(6,'0');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const EMOJI = { ELECTRONICS:'💻', CLOTHING:'👕', BOOKS:'📚', SPORTS:'🏃', FOOD:'🥘', BEAUTY:'💄', HOME:'🏠' };
const CATLABEL = { ELECTRONICS:'전자기기', CLOTHING:'의류', BOOKS:'도서', SPORTS:'스포츠', FOOD:'식품', BEAUTY:'뷰티', HOME:'홈' };
const STLABEL = { PENDING:'결제 대기', PAID:'결제 완료', REFUNDED:'환불 완료', CANCELLED:'취소됨' };

const saveCart = () => localStorage.setItem('se_cart', JSON.stringify(S.cart));
const $ = id => document.getElementById(id);

// ══════════════════ HTTP ══════════════════
async function api(method, url, body, retry = true) {
    const h = { 'Content-Type': 'application/json' };
    if (S.token) h['Authorization'] = 'Bearer ' + S.token;
    const res = await fetch(url, { method, headers: h, body: body ? JSON.stringify(body) : undefined });

    if (res.status === 401 && retry && S.refresh) {
        try {
            const r = await fetch('/api/auth/reissue', {
                method: 'POST', headers: { 'Content-Type':'application/json' },
                body: JSON.stringify({ refreshToken: S.refresh })
            });
            if (r.ok) {
                const d = await r.json();
                S.token = d.accessToken; S.refresh = d.refreshToken;
                localStorage.setItem('se_tok', d.accessToken);
                localStorage.setItem('se_ref', d.refreshToken);
                return api(method, url, body, false);
            }
        } catch(_) {}
        clearAuth();
        toast('세션이 만료되었습니다. 다시 로그인해주세요.', 'error');
        return null;
    }
    return res;
}

// ══════════════════ AUTH ══════════════════
function clearAuth() {
    S.token = S.refresh = S.user = null;
    localStorage.removeItem('se_tok');
    localStorage.removeItem('se_ref');
    renderNav();
}

async function doLogin() {
    const email = $('l-email').value.trim();
    const pw    = $('l-pw').value;
    showErr('l-err', '');
    if (!email || !pw) { showErr('l-err', '이메일과 비밀번호를 입력하세요.'); return; }

    const res = await api('POST', '/api/auth/login', { email, password: pw });
    if (!res) return;
    if (res.ok) {
        const d = await res.json();
        S.token = d.accessToken; S.refresh = d.refreshToken;
        localStorage.setItem('se_tok', d.accessToken);
        localStorage.setItem('se_ref', d.refreshToken);
        closeModal('m-login');
        $('l-email').value = ''; $('l-pw').value = '';
        await loadUser();
        toast('로그인되었습니다!', 'success');
    } else {
        const e = await res.json().catch(() => ({}));
        showErr('l-err', e.message || '이메일 또는 비밀번호가 올바르지 않습니다.');
    }
}

async function doRegister() {
    const name  = $('r-name').value.trim();
    const email = $('r-email').value.trim();
    const pw    = $('r-pw').value;
    showErr('r-err', '');
    if (!name || !email || !pw) { showErr('r-err', '모든 항목을 입력하세요.'); return; }

    const res = await api('POST', '/api/auth/signup', { name, email, password: pw });
    if (!res) return;
    if (res.ok) {
        closeModal('m-register');
        toast('회원가입 완료! 로그인해주세요.', 'success');
        $('l-email').value = email;
        openModal('m-login');
    } else {
        const e = await res.json().catch(() => ({}));
        showErr('r-err', e.message || '회원가입에 실패했습니다.');
    }
}

async function doLogout() {
    await api('POST', '/api/auth/logout');
    clearAuth();
    S.cart = []; saveCart(); updateBadge();
    closeDrop(); switchView('products');
    toast('로그아웃되었습니다.', 'info');
}

async function loadUser() {
    const res = await api('GET', '/api/users/me');
    if (res && res.ok) S.user = await res.json();
    renderNav();
}

function renderNav() {
    if (S.user) {
        $('guest-area').classList.add('hidden');
        $('user-area').classList.remove('hidden');
        $('view-tabs').classList.remove('hidden');
        $('nav-name').textContent = S.user.name;
        $('drop-name').textContent = S.user.name + (S.user.role === 'ADMIN' ? ' 👑' : '');
        $('drop-email').textContent = S.user.email;
    } else {
        $('guest-area').classList.remove('hidden');
        $('user-area').classList.add('hidden');
        $('view-tabs').classList.add('hidden');
    }
}

function toggleDrop() { $('user-drop').classList.toggle('hidden'); }
function closeDrop()  { $('user-drop').classList.add('hidden'); }
document.addEventListener('click', e => { if (!e.target.closest('.user-wrap')) closeDrop(); });

// ══════════════════ PRODUCTS ══════════════════
let _searchTimer = null;
function debounceSearch() {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(doSearch, 350);
}
function doSearch() { S.page = 0; loadProducts(); }

function resetFilters() {
    $('search-input').value = '';
    $('f-cat').value = '';
    $('f-min').value = '';
    $('f-max').value = '';
    doSearch();
}

async function loadProducts() {
    const grid = $('product-grid');
    grid.innerHTML = '<div class="loading"><div class="spin"></div> 불러오는 중...</div>';

    const q = new URLSearchParams({ page: S.page, size: 12 });
    const kw  = $('search-input').value.trim();
    const cat = $('f-cat').value;
    const mn  = $('f-min').value;
    const mx  = $('f-max').value;
    if (kw)  q.set('keyword', kw);
    if (cat) q.set('category', cat);
    if (mn)  q.set('minPrice', mn);
    if (mx)  q.set('maxPrice', mx);

    const res = await fetch('/api/products?' + q);
    if (!res.ok) {
        grid.innerHTML = '<div class="empty"><div class="empty-icon">😵</div><div class="empty-title">불러오기 실패</div></div>';
        return;
    }
    const data = await res.json();
    S.totalPages = data.totalPages;

    if (!data.content.length) {
        grid.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">검색 결과가 없습니다</div><p class="text-muted">다른 검색어를 시도해보세요.</p></div>';
        $('pagination').innerHTML = '';
        return;
    }

    grid.innerHTML = data.content.map(p => `
        <div class="product-card" onclick="openProduct(${p.id})">
            <div class="product-thumb">${EMOJI[p.category] || '📦'}</div>
            <div class="product-body">
                <div class="product-cat">${esc(CATLABEL[p.category] || p.category)}</div>
                <div class="product-name">${esc(p.name)}</div>
                <div class="product-price">${money(p.price)}</div>
                <div class="product-stock ${p.stock===0?'out-of-stock':''}">
                    ${p.stock===0 ? '품절' : '재고 '+p.stock+'개'}
                </div>
            </div>
        </div>
    `).join('');

    renderPages();
}

function renderPages() {
    const el = $('pagination');
    if (S.totalPages <= 1) { el.innerHTML=''; return; }
    const s = Math.max(0, S.page-2), e = Math.min(S.totalPages-1, S.page+2);
    let h = S.page>0 ? `<button class="page-btn" onclick="goPage(${S.page-1})">‹</button>` : '';
    for (let i=s; i<=e; i++)
        h += `<button class="page-btn ${i===S.page?'active':''}" onclick="goPage(${i})">${i+1}</button>`;
    if (S.page<S.totalPages-1)
        h += `<button class="page-btn" onclick="goPage(${S.page+1})">›</button>`;
    el.innerHTML = h;
}
function goPage(p) { S.page=p; loadProducts(); window.scrollTo({top:0,behavior:'smooth'}); }

async function openProduct(id) {
    const res = await fetch('/api/products/'+id);
    if (!res.ok) return;
    const p = await res.json();
    S.detail = p;

    $('pd-thumb').textContent = EMOJI[p.category] || '📦';
    $('pd-cat').textContent   = CATLABEL[p.category] || p.category;
    $('pd-name').textContent  = p.name;
    $('pd-price').textContent = money(p.price);
    $('pd-desc').textContent  = p.description || '상품 설명이 없습니다.';
    $('pd-stock').textContent = p.stock===0 ? '품절' : p.stock+'개';
    $('pd-qty').textContent   = '1';

    const btn = $('pd-add');
    if (p.stock===0) {
        btn.disabled = true;
        btn.textContent = '품절';
        btn.className = 'btn btn-ghost btn-full';
    } else {
        btn.disabled = false;
        btn.textContent = '🛒 장바구니 담기';
        btn.className = 'btn btn-primary btn-full';
    }
    openModal('m-product');
}

function adjQty(d) {
    const el = $('pd-qty');
    const max = S.detail ? S.detail.stock : 99;
    el.textContent = Math.max(1, Math.min(max, +el.textContent + d));
}

function addFromModal() {
    if (!S.detail) return;
    addToCart(S.detail, +$('pd-qty').textContent);
    closeModal('m-product');
}

// ══════════════════ CART ══════════════════
function addToCart(p, qty=1) {
    const ex = S.cart.find(i => i.id===p.id);
    if (ex) ex.quantity = Math.min(ex.quantity+qty, p.stock);
    else    S.cart.push({ id:p.id, name:p.name, price:+p.price, category:p.category, stock:p.stock, quantity:qty });
    saveCart(); updateBadge();
    toast(`"${p.name}"을(를) 장바구니에 담았습니다.`, 'success');
}

function removeCI(id) { S.cart = S.cart.filter(i=>i.id!==id); saveCart(); updateBadge(); renderCart(); }
function changeCI(id, d) {
    const it = S.cart.find(i=>i.id===id);
    if (!it) return;
    it.quantity = Math.max(1, Math.min(it.stock, it.quantity+d));
    saveCart(); renderCart();
}

function updateBadge() {
    const tot = S.cart.reduce((s,i)=>s+i.quantity,0);
    const el = $('cart-badge');
    tot>0 ? (el.textContent=tot>99?'99+':tot, el.classList.remove('hidden'))
          : el.classList.add('hidden');
}

function renderCart() {
    const el = $('cart-items');
    const tot = S.cart.reduce((s,i)=>s+i.price*i.quantity,0);
    $('cart-total').textContent = money(tot);

    if (!S.cart.length) {
        el.innerHTML = '<div class="cart-empty">🛒<br><br>장바구니가 비어있습니다.</div>';
        return;
    }
    el.innerHTML = S.cart.map(i=>`
        <div class="ci">
            <div class="ci-icon">${EMOJI[i.category]||'📦'}</div>
            <div class="ci-info">
                <div class="ci-name">${esc(i.name)}</div>
                <div class="ci-sub">${money(i.price)} × ${i.quantity} = ${money(i.price*i.quantity)}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
                <div class="qty-ctrl">
                    <button class="qty-btn" onclick="changeCI(${i.id},-1)">−</button>
                    <span class="qty-num">${i.quantity}</span>
                    <button class="qty-btn" onclick="changeCI(${i.id},1)">+</button>
                </div>
                <button class="ci-del" onclick="removeCI(${i.id})">삭제</button>
            </div>
        </div>
    `).join('');
}

function openCart()  { renderCart(); $('cart-bd').classList.remove('hidden'); $('cart-panel').classList.remove('hidden'); }
function closeCart() { $('cart-bd').classList.add('hidden'); $('cart-panel').classList.add('hidden'); }

async function doCheckout() {
    if (!S.cart.length) { toast('장바구니가 비어있습니다.', 'error'); return; }
    if (!S.token) { closeCart(); openModal('m-login'); toast('주문하려면 로그인이 필요합니다.', 'info'); return; }

    const btn = $('checkout-btn');
    btn.disabled=true; btn.textContent='처리 중...';

    const res = await api('POST', '/api/orders', { items: S.cart.map(i=>({productId:i.id,quantity:i.quantity})) });
    btn.disabled=false; btn.textContent='주문하기';
    if (!res) return;

    if (res.ok) {
        const id = await res.json();
        S.cart=[]; saveCart(); updateBadge(); closeCart();
        toast(`주문 완료! (주문 ${oid(id)})`, 'success');
        switchView('orders');
    } else {
        const e = await res.json().catch(()=>({}));
        toast(e.message || '주문 처리 중 오류가 발생했습니다.', 'error');
    }
}

// ══════════════════ ORDERS ══════════════════
async function loadOrders() {
    const el = $('orders-list');
    el.innerHTML = '<div class="loading"><div class="spin"></div> 불러오는 중...</div>';
    const res = await api('GET', '/api/orders');
    const orders = (res && res.ok) ? await res.json() : [];

    if (!orders.length) {
        el.innerHTML = `<div class="empty">
            <div class="empty-icon">📦</div>
            <div class="empty-title">주문 내역이 없습니다</div>
            <p class="text-muted">상품을 장바구니에 담고 첫 주문을 해보세요!</p>
            <button class="btn btn-primary" style="margin-top:16px;" onclick="switchView('products')">상품 보러 가기</button>
        </div>`;
        return;
    }

    el.innerHTML = orders.map(o=>`
        <div class="order-card">
            <div class="order-header">
                <div>
                    <div class="order-id">주문 ${oid(o.id)}</div>
                    <div class="order-date">${fmtDate(o.createdAt)}</div>
                </div>
                <span class="status-pill s-${o.status}">${STLABEL[o.status]||o.status}</span>
            </div>
            <div class="order-total">${money(o.totalPrice)}</div>
            <div class="order-actions">
                <button class="btn btn-ghost btn-sm" onclick="openOrderDetail(${o.id})">상세 보기</button>
                ${o.status==='PENDING' ? `
                    <button class="btn btn-primary btn-sm" onclick="openPayment(${o.id},${o.totalPrice})">결제하기</button>
                    <button class="btn btn-danger btn-sm" onclick="cancelOrder(${o.id})">주문 취소</button>
                ` : ''}
            </div>
        </div>
    `).join('');
}

async function openOrderDetail(id) {
    const res = await api('GET', '/api/orders/'+id);
    if (!res||!res.ok) return;
    const o = await res.json();

    $('order-detail').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <span style="font-size:14px;color:var(--muted);font-weight:500;">주문 ${oid(o.id)}</span>
            <span class="status-pill s-${o.status}">${STLABEL[o.status]||o.status}</span>
        </div>
        <div style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:16px;">
            ${o.items.map(it=>`
                <div class="od-item">
                    <span>상품 #${it.productId} × ${it.quantity}개</span>
                    <span style="font-weight:600;">${money(it.price*it.quantity)}</span>
                </div>
            `).join('')}
        </div>
        <div class="od-row"><span class="od-label">주문 일시</span><span>${fmtDate(o.createdAt)}</span></div>
        <div class="od-row">
            <span class="od-label">결제 금액</span>
            <span style="font-weight:700;color:var(--primary);">${money(o.totalPrice)}</span>
        </div>
        ${o.status==='PENDING' ? `
            <div style="display:flex;gap:8px;margin-top:16px;">
                <button class="btn btn-primary" onclick="closeModal('m-order');openPayment(${o.id},${o.totalPrice})">결제하기</button>
                <button class="btn btn-danger" onclick="closeModal('m-order');cancelOrder(${o.id})">주문 취소</button>
            </div>
        ` : ''}
    `;
    openModal('m-order');
}

async function cancelOrder(id) {
    if (!confirm(`주문 ${oid(id)}을 취소하시겠습니까?`)) return;
    const res = await api('DELETE', '/api/orders/'+id);
    if (res&&res.ok) { toast('주문이 취소되었습니다.', 'success'); loadOrders(); }
    else if (res) {
        const e = await res.json().catch(()=>({}));
        toast(e.message||'주문 취소에 실패했습니다.', 'error');
    }
}

async function openPayment(orderId, amount) {
    if (!S.clientKey) {
        toast('결제 설정을 불러오지 못했습니다.', 'error');
        return;
    }
    if (!S.user) {
        openModal('m-login');
        return;
    }

    const tossPayments = TossPayments(S.clientKey);
    const payment = tossPayments.payment({ customerKey: `user-${S.user.id}` });
    const tossOrderId = `order-${String(orderId).padStart(6, '0')}-${Date.now()}`;

    try {
        await payment.requestPayment({
            method: 'CARD',
            amount: { currency: 'KRW', value: Number(amount) },
            orderId: tossOrderId,
            orderName: 'ShopEasy 주문',
            successUrl: `${window.location.origin}/`,
            failUrl:    `${window.location.origin}/?paymentFail=1`,
            customerEmail: S.user.email,
            customerName:  S.user.name,
        });
    } catch (e) {
        if (e.code !== 'USER_CANCEL') {
            toast(e.message || '결제 중 오류가 발생했습니다.', 'error');
        }
    }
}

async function handlePaymentRedirect() {
    const params = new URLSearchParams(window.location.search);
    const paymentKey = params.get('paymentKey');
    const orderId    = params.get('orderId');
    const amount     = params.get('amount');
    const fail       = params.get('paymentFail');

    // URL 파라미터 즉시 제거
    window.history.replaceState({}, '', '/');

    if (fail) {
        toast('결제가 취소되었습니다.', 'error');
        return;
    }

    if (!paymentKey || !orderId || !amount) return;

    openModal('m-payment');
    const res = await api('POST', '/api/payments/confirm', {
        paymentKey,
        orderId,
        amount: Number(amount),
        idempotencyKey: `idem-${orderId}-${Date.now()}`,
    });
    closeModal('m-payment');

    if (res && res.ok) {
        toast('결제가 완료되었습니다! 🎉', 'success');
        switchView('orders');
    } else if (res) {
        const e = await res.json().catch(() => ({}));
        toast(e.message || '결제 승인 중 오류가 발생했습니다.', 'error');
        switchView('orders');
    }
}

// ══════════════════ VIEW ══════════════════
function switchView(v) {
    if (v==='orders'&&!S.token) { openModal('m-login'); toast('로그인이 필요합니다.','info'); return; }
    $('view-products').classList.toggle('hidden', v!=='products');
    $('view-orders').classList.toggle('hidden',   v!=='orders');
    $('tab-products')?.classList.toggle('active', v==='products');
    $('tab-orders')?.classList.toggle('active',   v==='orders');
    if (v==='orders') loadOrders();
}

// ══════════════════ MODALS ══════════════════
function openModal(id)  { $(id).classList.remove('hidden'); }
function closeModal(id) { $(id).classList.add('hidden'); }
function overlayClick(e,id) { if(e.target.id===id) closeModal(id); }

// ══════════════════ TOAST ══════════════════
function toast(msg, type='info') {
    const el = document.createElement('div');
    el.className = `toast t-${type}`;
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(()=>el.remove(), 3200);
}

// ══════════════════ HELPERS ══════════════════
function showErr(id, msg) {
    const el = $(id);
    if (msg) { el.textContent=msg; el.classList.remove('hidden'); }
    else el.classList.add('hidden');
}

// ══════════════════ INIT ══════════════════
(async () => {
    updateBadge();

    // Toss client key 로드
    try {
        const r = await fetch('/api/payments/client-key');
        if (r.ok) S.clientKey = (await r.json()).clientKey;
    } catch (_) {}

    if (S.token) await loadUser();
    else renderNav();

    // Toss 결제 리다이렉트 처리 (successUrl / failUrl)
    await handlePaymentRedirect();

    await loadProducts();
})();
</script>
